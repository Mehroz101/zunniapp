name: CI Build & Typecheck (Hostinger Direct Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js production app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.MONGODB_URI }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: https://toolty.online
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          NODE_ENV: production
