name: Deploy to Hostinger (toolty.online)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js (GitHub Runner) ────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install deps (GitHub Runner) ──────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js (GitHub Runner — full Node.js available) ─
      - name: Build Next.js app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_URL: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: https://toolty.online
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          NODE_ENV: production

      # ── 5. Prepare standalone output for upload ───────────────────
      - name: Prepare standalone bundle
        run: |
          # Copy static assets into standalone (required for Next.js standalone)
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Copy root server.js into standalone if present
          [ -f server.js ] && cp server.js .next/standalone/server.js || true

      # ── 6. Upload built files to Hostinger via SCP ────────────────
      #    We upload ONLY the compiled output — no npm/build on server needed
      - name: Upload standalone build to Hostinger (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          source: ".next/standalone/"
          target: "~/domains/toolty.online/public_html"
          strip_components: 2   # removes ".next/standalone/" prefix on target

      # ── 7. Restart Node.js app on Hostinger via SSH ───────────────
      #    No npm/build needed — just signal Hostinger to reload the process
      - name: Restart Node.js app on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 65002
          script_stop: false
          script: |
            TARGET="$HOME/domains/toolty.online/public_html"
            mkdir -p "$TARGET/tmp"
            touch "$TARGET/tmp/restart.txt"
            echo "✅ Restart signal sent — toolty.online will reload in a few seconds."
