name: Deploy to Hostinger (toolty.online)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Dependencies install (GitHub Runner)
      - name: Install dependencies
        run: npm ci

      # 4. Next.js production build verification
      - name: Build Next.js app
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      # 5. SSH Remote Deployment to Hostinger
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: 22
          script_stop: false
          script: |
            echo "==========================================="
            echo "🚀 Starting Hostinger Deployment..."
            echo "Current User: $(whoami)"
            echo "Current Dir:  $(pwd)"
            echo "==========================================="

            # 1. Locate web directory
            TARGET_DIR=""
            if [ -d "$HOME/domains/toolty.online/public_html" ]; then
              TARGET_DIR="$HOME/domains/toolty.online/public_html"
            elif [ -d "$HOME/public_html" ]; then
              TARGET_DIR="$HOME/public_html"
            else
              echo "⚠️ Default domain directory not found, checking current directory..."
              TARGET_DIR="$(pwd)"
            fi

            echo "📁 Deploying to: $TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            # 2. Resilient Git Sync
            echo "🔄 Synchronizing Git code from Mehroz101/zunniapp..."
            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin https://github.com/Mehroz101/zunniapp.git
            else
              git remote set-url origin https://github.com/Mehroz101/zunniapp.git
            fi

            # Stash any local changes on server to prevent pull aborts
            git stash || true
            git fetch origin main --depth=1
            git reset --hard origin/main

            # 3. Install dependencies (including devDependencies needed for build)
            echo "📦 Installing npm dependencies on Hostinger..."
            npm install --no-audit --no-fund

            # 4. Generate Prisma Client & Build Next.js
            echo "🏗️ Generating Prisma Client & building Next.js..."
            npx prisma generate || true
            npm run build

            # 5. Restart Node.js application on Hostinger
            echo "♻️ Restarting Node.js application..."
            # Hostinger Passenger restart mechanism (Standard for hPanel Node.js)
            mkdir -p tmp
            touch tmp/restart.txt

            # PM2 restart (if used on Hostinger VPS / custom Node)
            if command -v pm2 &> /dev/null; then
              echo "Restarting via PM2..."
              pm2 reload toolty-frontend || pm2 restart toolty-frontend || pm2 reload all || true
            fi

            echo "==========================================="
            echo "✅ Deployment complete! toolty.online is live."
            echo "==========================================="
